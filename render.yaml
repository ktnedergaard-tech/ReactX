# Render "Blueprint" – gør opsætning af parrings-serveren til ét klik.
# Se: https://render.com/docs/blueprint-spec
#
# Deploy-knap (peger på dette repo):
# https://render.com/deploy?repo=https://github.com/ktnedergaard-tech/ReactX
services:
  - type: web
    name: reactx-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
